<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Jewellry Management</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to your existing styles -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .payment-container {
            max-width: 500px;
            background: #fff;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .cart-summary {
            background: #f1f1f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .cart-summary p {
            font-size: 18px;
            color: #555;
            margin: 5px 0;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #d4af37;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #b8860b;
        }
    </style>
</head>
<body>

    <div class="payment-container">
        <h1> Payment</h1>
        <div class="cart-summary">
            <p><strong>Total Items:</strong> <span id="total-items">0</span></p>
            <p><strong>Total Price:</strong> <span id="total-price">Rs. 0</span></p>
        </div>

        <form id="payment-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="payment-method">Payment Method</label>
                <select id="payment-method" required>
                    <option value="">Select Payment Method</option>
                    <option value="credit-card">Credit Card</option>
                    <option value="debit-card">Debit Card</option>
                    <option value="upi">UPI</option>
                    <option value="net-banking">Net Banking</option>
                    <option value="cash-on-delivery">Cash on Delivery</option>
                </select>
            </div>
            <div id="payment-details"></div>
            <button type="button" class="btn" onclick="confirmPayment()">Confirm Payment</button>
        </form>
    </div>

    <script>
        document.getElementById("payment-method").addEventListener("change", function() {
            let method = this.value;
            let detailsContainer = document.getElementById("payment-details");
            detailsContainer.innerHTML = "";

            if (method === "credit-card" || method === "debit-card") {
                detailsContainer.innerHTML = `
                    <div class="form-group">
                        <label for="card">Card Number</label>
                        <input type="text" id="card" placeholder="1234 5678 9012 3456" required>
                    </div>
                    <div class="form-group">
                        <label for="expiry">Expiry Date</label>
                        <input type="month" id="expiry" required>
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" placeholder="123" required>
                    </div>
                `;
            } else if (method === "upi") {
                detailsContainer.innerHTML = `
                    <div class="form-group">
                        <label for="upi-id">UPI ID</label>
                        <input type="text" id="upi-id" placeholder="example@upi" required>
                    </div>
                `;
            } else if (method === "net-banking") {
                detailsContainer.innerHTML = `
                    <div class="form-group">
                        <label for="bank">Select Bank</label>
                        <select id="bank" required>
                            <option value="">Select Your Bank</option>
                            <option value="hdfc">HDFC Bank</option>
                            <option value="sbi">State Bank of India</option>
                            <option value="icici">ICICI Bank</option>
                        </select>
                    </div>
                `;
            }
        });

        function loadPaymentDetails() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let totalItems = cart.length;
            let totalPrice = cart.reduce((sum, item) => sum + parseFloat(item.price.replace('Rs. ', '')), 0);
            document.getElementById("total-items").textContent = totalItems;
            document.getElementById("total-price").textContent = "Rs. " + totalPrice.toFixed(2);
        }

        function confirmPayment() {
            let paymentMethod = document.getElementById("payment-method").value;
            if (!paymentMethod) {
                alert("Please select a payment method.");
                return;
            }
            alert("Payment Successful! Your order will be delivered within 3-5 business days.");
            localStorage.removeItem("cart");
            window.location.href = "index.html";
        }

        document.addEventListener("DOMContentLoaded", loadPaymentDetails);
    </script>
</body>
</html>
