<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #d4af37, #fff8dc);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .input-box {
            margin: 20px 0;
            text-align: left;
        }
        
        .input-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #b8860b;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            margin-top: 10px;
            box-sizing: border-box;
        }
        
        .error {
            color: red;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }
        
        .btn {
            background: #b8860b;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }
        btn:hover {
            background: #8b6508;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-box">
            <h2 id="form-title">Login</h2>
            <form id="auth-form">
                <div id="login-fields">
                    <div class="input-box">
                        <input type="email" id="login-email" placeholder="Email" required>
                        <p class="error" id="login-email-error"></p>
                    </div>
                    <div class="input-box">
                        <input type="password" id="login-password" placeholder="Password" required>
                        <p class="error" id="login-password-error"></p>
                    </div>
                </div>
                <div class="hidden" id="register-fields">
                    <div class="input-box">
                        <input type="text" id="name" placeholder="Full Name" required>
                        <p class="error" id="name-error"></p>
                    </div>
                    <div class="input-box">
                        <input type="email" id="email" placeholder="Email" required>
                        <p class="error" id="email-error"></p>
                    </div>
                    <div class="input-box">
                        <input type="tel" id="phone" placeholder="Phone Number" maxlength="10" required>
                        <p class="error" id="phone-error"></p>
                    </div>
                    <div class="input-box">
                        <input type="password" id="reg-password" placeholder="Password" required>
                        <p class="error" id="reg-password-error"></p>
                    </div>
                </div>
                <button type="submit" class="btn" id="submit-btn">Login</button>
                
                <a href="index.html">back to home</a>
                <p class="toggle-text">Don't have an account? <a id="toggle-form">Register</a></p>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('toggle-form').addEventListener('click', function(event) {
            event.preventDefault();
            const formTitle = document.getElementById('form-title');
            const loginFields = document.getElementById('login-fields');
            const registerFields = document.getElementById('register-fields');
            const submitBtn = document.getElementById('submit-btn');
            if (formTitle.textContent === 'Login') {
                formTitle.textContent = 'Register';
                loginFields.classList.add('hidden');
                registerFields.classList.remove('hidden');
                submitBtn.textContent = 'Register';
                this.textContent = 'Already have an account? Login';
            } else {
                formTitle.textContent = 'Login';
                loginFields.classList.remove('hidden');
                registerFields.classList.add('hidden');
                submitBtn.textContent = 'Login';
                this.textContent = "Don't have an account? Register";
            }
        });

        document.getElementById('auth-form').addEventListener('submit', function(event) {
            event.preventDefault();
            let valid = true;
            document.querySelectorAll('.error').forEach(el => el.textContent = '');

            function validateField(id, errorId, message, regex = null) {
                const field = document.getElementById(id);
                if (!field.value || (regex && !regex.test(field.value))) {
                    document.getElementById(errorId).textContent = message;
                    valid = false;
                }
            }

            if (document.getElementById('form-title').textContent === 'Register') {
                validateField('name', 'name-error', 'Full Name is required');
                validateField('email', 'email-error', 'Valid Email is required');
                validateField('phone', 'phone-error', 'Phone number should be of 10 Digit', /^\d{10}$/);
                validateField('reg-password', 'reg-password-error', 'Password must be at least 8 characters, include 1 uppercase, 1 lowercase, 1 number, and 1 special character', /^(?=.[a-z])(?=.[A-Z])(?=.\d)(?=.[@$!%?&])[A-Za-z\d@$!%?&]{8,}$/);
            }

            if (!valid) {
                return;
            }
            this.submit();
        });
    </script>
</body>

</html>
