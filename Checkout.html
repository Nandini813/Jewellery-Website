<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Jewellry Management</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to your existing CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .checkout-container {
            max-width: 600px;
            background: #fff;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .cart-table th, .cart-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        .cart-table th {
            background-color: #d4af37;
            color: white;
        }
        .cart-summary {
            background: #f1f1f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .cart-summary p {
            font-size: 18px;
            color: #555;
            margin: 5px 0;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #d4af37; /* Gold color */
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #b8860b; /* Darker gold */
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h1>Add to Cart</h1>
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product Image</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody id="cart-items"></tbody>
        </table>
        <div class="cart-summary">
            <p><strong>Total Items:</strong> <span id="total-items">0</span></p>
            <p><strong>Total Price:</strong> <span id="total-price">Rs. 0</span></p>
        </div>
        <button onclick="proceedToPayment()" class="btn">Proceed to Payment</button>
        <a href="index.html">Back to Home</a>
    </div>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let cartTable = document.getElementById("cart-items");
            let totalItems = cart.length;
            let totalPrice = cart.reduce((sum, item) => sum + parseFloat(item.price.replace('Rs. ', '')), 0);
            
            cartTable.innerHTML = "";
            if (cart.length === 0) {
                cartTable.innerHTML = "<tr><td colspan='4'>Your cart is empty!</td></tr>";
            } else {
                cart.forEach((item, index) => {
                    let row = `<tr>
                        <td><img src="${item.image}" width="50"></td>
                        <td>${item.name}</td>
                        <td>${item.price}</td>
                        <td><button onclick="removeFromCart(${index})">Remove</button></td>
                    </tr>`;
                    cartTable.innerHTML += row;
                });
            }
            document.getElementById("total-items").textContent = totalItems;
            document.getElementById("total-price").textContent = "Rs. " + totalPrice.toFixed(2);
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
        }

        function proceedToPayment() {
            window.location.href = "payment.html";
        }

        document.addEventListener("DOMContentLoaded", loadCart);
    </script>
</body>
</html>
